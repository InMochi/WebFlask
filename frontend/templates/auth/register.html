{% extends "base.html" %}

{% block title %}{{ page_title }} - WebFlask{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="auth-card">
            <span class="badge">Akun Baru</span>
            <h1>Daftar Akun</h1>
            <p class="auth-subtitle">Password minimal 8 karakter (semua karakter diperbolehkan).</p>

            <p class="form-error" role="alert" hidden data-auth-error></p>

            <form
                class="auth-form"
                data-auth-form="register"
                data-endpoint="{{ url_for('auth.register') }}"
                data-csrf-endpoint="{{ url_for('auth.issue_csrf_token') }}"
                data-redirect="{{ url_for('web.login_page') }}"
            >
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input
                        class="form-input"
                        id="register-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input
                        class="form-input"
                        id="register-password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >
                </div>

                <button class="btn btn-primary btn-block" type="submit" data-submit-btn>
                    Daftar
                </button>
            </form>

            <p class="auth-switch">
                Sudah punya akun?
                <a href="{{ url_for('web.login_page') }}">Masuk di sini</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
{% endblock %}

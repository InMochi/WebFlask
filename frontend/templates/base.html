<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebFlask{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{{ url_for('web.home') }}">WebFlask</a>
            <nav class="site-nav" aria-label="Navigasi utama">
                <a href="{{ url_for('web.home') }}">Beranda</a>
                {% if current_user %}
                <a href="{{ url_for('web.dashboard') }}">Dashboard</a>
                {% else %}
                <a href="{{ url_for('web.login_page') }}">Masuk</a>
                <a href="{{ url_for('web.register_page') }}">Daftar</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 WebFlask. Dibangun dengan Flask &amp; Jinja2.</p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
